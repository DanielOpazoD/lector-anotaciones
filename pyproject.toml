[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lector-anotaciones"
version = "0.6.0"
description = "Un libro en Markdown convertido en una página de lectura donde el autor destaca y anota, con cada anotación trazable al archivo y la línea de origen."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Opazo" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["markdown", "libro", "anotaciones", "lectura", "edición"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.18", "mypy>=1.10"]

[project.scripts]
lector-anotaciones = "lector_anotaciones.cli:main"

[project.urls]
Repository = "https://github.com/DanielOpazoD/lector-anotaciones"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lector_anotaciones = ["web/*.html", "web/*.css", "web/nucleo/*.js", "web/pagina/*.js", "esquemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el texto en español usa «», · y ∗ a propósito

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# Tipos: el paquete pasa `mypy --strict`. Los datos en JSON llevan sus alias (tipos.py: Anotacion, Libro, Seccion…).
[tool.mypy]
files = ["src/lector_anotaciones"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Cobertura: un detector de lo que ninguna prueba toca, no un objetivo. El piso sale de una medición real
# (0.6: 97 % de líneas y ramas del paquete) y sólo avisa de una caída; no se sube por cosmética.
[tool.coverage.run]
source = ["lector_anotaciones"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
