[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lector-anotaciones"
version = "0.2.10"
description = "Un libro en Markdown convertido en una página de lectura donde el autor destaca y anota, con cada anotación trazable al archivo y la línea de origen."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Opazo" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["markdown", "libro", "anotaciones", "lectura", "edición"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lector-anotaciones = "lector_anotaciones.cli:main"

[project.urls]
Repository = "https://github.com/DanielOpazoD/lector-anotaciones"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el texto en español usa «», · y ∗ a propósito

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
