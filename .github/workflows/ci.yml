name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: ruff + pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # poppler para que las pruebas que leen un PDF de verdad corran en vez de saltarse
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: ruff check .
      - run: ruff format --check .
      # tipos: el paquete pasa mypy --strict (configuración en pyproject.toml)
      - run: mypy
      # con cobertura: el piso (pyproject.toml) avisa si algo deja de probarse
      - run: pytest --cov

  ejemplo:
    name: construir el ejemplo con PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pip install -e .
      - name: Maquetar el ejemplo en un PDF mínimo y construir libro.json con páginas
        run: |
          # Sin maquetador en el runner, el PDF lo escribe tests/pdf_minimo.py (texto plano, una sección por página);
          # basta para que pdfinfo y pdftotext lean páginas de verdad y `--pdf` recorra todo el camino.
          python -m tests.pdf_minimo ejemplo/fuentes --salida ejemplo/salida/libro.pdf
          pdfinfo ejemplo/salida/libro.pdf
          lector-anotaciones construir ejemplo/fuentes --pdf ejemplo/salida/libro.pdf --salida ejemplo/salida/libro.json --titulo "Libro de ejemplo" --estricto
          python - <<'PY'
          import json
          L = json.load(open("ejemplo/salida/libro.json", encoding="utf-8"))
          assert L["secciones"], "sin secciones"
          assert L["paginas_fisicas"], "el PDF no aportó páginas físicas"
          con = [b for s in L["secciones"] for b in s["bloques"] if b.get("pagina")]
          assert con, "ningún bloque tiene página"
          print(len(L["secciones"]), "secciones;", len(con), "bloques con página de", L["paginas_fisicas"], "físicas")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: libro-ejemplo
          path: |
            ejemplo/salida/libro.json
            ejemplo/salida/libro.pdf

  web:
    name: página (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - run: npm install
      # formato del JavaScript (Prettier, con la configuración de .prettierrc.json)
      - run: npm run formato
      # los módulos de la página: tipos/pagina.d.ts y docs/MODULOS.md salen de pagina/*.js y tienen que estar al día
      - run: npm run modulos -- --comprobar
      # tipos (JSDoc, tipos/globales.d.ts y tipos/pagina.d.ts) con tsc --checkJs sobre el núcleo y la página
      - run: npm run tipos
      # web/index.html se genera desde src/lector_anotaciones/web/: tiene que estar al día con sus fuentes
      - run: lector-anotaciones pagina --salida web/index.html --comprobar
      # el núcleo con su cobertura; los pisos (package.json) salen de una medición real: 66,5 % de líneas, 84,5 % de
      # ramas y 86,4 % de funciones (los importadores se prueban sobre todo en el navegador)
      - name: Núcleo de la página (node --test, con cobertura)
        run: npm run cobertura:js
      - run: lector-anotaciones construir ejemplo/fuentes --salida ejemplo/salida/libro.json --titulo "Libro de ejemplo" --estricto
      - run: npx playwright install --with-deps chromium
      # tests/web/*.spec.mjs en paralelo, con la cobertura de la página por fragmento (piso: 92 %, medido 93,2 %); ante
      # un fallo, el informe con capturas queda como artefacto, y el de cobertura siempre
      - run: npm run cobertura:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas-navegador
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-pagina
          path: cobertura/web.md
